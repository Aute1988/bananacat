name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Single concurrency: cancel old runs when a new deploy starts
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend (Vite)
        working-directory: frontend
        # Default to '/bananacat/' so the built site loads from
        # https://<owner>.github.io/bananacat/. Override via the
        # VITE_BASE_PATH repo variable when using a custom domain or
        # user site.
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/bananacat/' }}
          VITE_CHAIN_RPC_BNB: ${{ vars.VITE_CHAIN_RPC_BNB }}
          VITE_CHAIN_RPC_ETH: ${{ vars.VITE_CHAIN_RPC_ETH }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
