<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>离线模式 · 🍌🐱 香蕉猫</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a14;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      padding: 20px;
      text-align: center;
    }
    .emoji { font-size: 80px; margin-bottom: 20px; animation: spin 3s linear infinite; }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    h1 { font-size: 24px; margin-bottom: 12px; color: #f59e0b; }
    p { color: #9ca3af; max-width: 400px; line-height: 1.6; margin-bottom: 24px; }
    button {
      padding: 10px 24px; border-radius: 12px; border: none;
      background: #f59e0b; color: #000; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="emoji">🐱</div>
  <h1>暂时连不上网啦</h1>
  <p>请检查你的网络连接。已经看过的页面可以从浏览器缓存加载,但新功能需要连网后才能用。</p>
  <button onclick="location.reload()">🔄 再试一次</button>
</body>
</html>
