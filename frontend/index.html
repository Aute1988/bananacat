<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fcd34d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="香蕉猫" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="mask-icon" href="icons/icon.svg" color="#fcd34d" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="🍌🐱 香蕉猫 Meme 发射台 - 支持 LP 锁仓自选的多链代币发射平台" />

    <title>🍌🐱 香蕉猫 Launchpad · Meme 发射台</title>

    <!-- 预连接 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 高级字体集 - 科技感/现代感 -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 全局噪点 + 扫描线叠层(科技感 + 颗粒感) -->
    <div id="__noise-overlay"></div>
    <div id="__scanlines"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 注册 Service Worker(只在生产 + 支持的环境)
      if ('serviceWorker' in navigator && location.protocol !== 'blob:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('🐱 SW registered:', reg.scope))
            .catch(err => console.warn('🐱 SW registration failed:', err))
        })
      }
    </script>
  </body>
</html>
