<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fcd34d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="香蕉猫" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="mask-icon" href="icons/icon.svg" color="#fcd34d" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="🍌🐱 香蕉猫 Meme 发射台 - 支持 LP 锁仓自选的多链代币发射平台" />

    <title>🍌🐱 香蕉猫 Launchpad · Meme 发射台</title>

    <!-- 预连接 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 高级字体集 - 科技感/现代感 -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 全局噪点 + 扫描线叠层(科技感 + 颗粒感) -->
    <div id="__noise-overlay"></div>
    <div id="__scanlines"></div>
    <!--
      ⛑️ 诊断标记: 不依赖 React / SW / 任何 bundle,
      直接 inline 在 #root 同级。每次刷新一定能看到。
      如果连这条都没出现,说明浏览器拿到的是空 HTML / SW 缓存了坏版本。
    -->
    <div id="__diagnostic_banner" style="position:fixed;top:0;left:0;right:0;padding:10px 16px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1a1a1a;font:600 13px/1.4 system-ui;z-index:2147483647;box-shadow:0 2px 12px rgba(0,0,0,.4);text-align:center;">
      🍌 香蕉猫 · HTML 正常加载 &mdash;
      <span id="__diag_ts"></span>
    </div>
    <script>
      // 显示当前时间戳 + SW 状态,让我们能确定 SW 没缓存住旧 HTML
      document.getElementById('__diag_ts').textContent =
        'loaded ' + new Date().toISOString().slice(11,19) + ' UTC' +
        ' · SW: ' + (navigator.serviceWorker?.controller ? 'controlled (cached!)' : 'no controller')

      // 🔥 关键诊断: 直接在 DOM 顶部 inline 一个不可能被 CSS 隐藏的
      // 红色大块(高度 200px,顶部 0 位置,最大 z-index)。
      // 如果连这个都看不到 → 是浏览器/SW/扩展程序层面的问题(不是 CSS)。
      // 如果这个能看到但 React tree 看不到 → React 内容被某层覆盖了。
      var probe = document.createElement('div')
      probe.id = '__inline_probe'
      probe.style.cssText = [
        'position:fixed',
        'top:50px',
        'left:0',
        'right:0',
        'height:200px',
        'z-index:2147483646',
        'background:linear-gradient(90deg,#ef4444,#dc2626)',
        'color:#fff',
        'font:700 22px/1.4 system-ui',
        'display:flex',
        'align-items:center',
        'justify-content:center',
        'text-align:center',
        'padding:20px',
        'box-sizing:border-box'
      ].join(';')
      probe.innerHTML = '🔥 红色探针: 如果你看到这条红色横幅,说明 HTML inline 渲染 OK。下一条是 React (#root) 是否正常的对比。'
      document.body.appendChild(probe)

      // 🔥 强制立即 unregister 所有 SW (不等待 window.load,避免被旧
      // bundle 拦截). 即使 SW 还在 controller 状态,下次刷新就会失
      // 效. 同时强制 cache API 清空.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister() })
          // 在 banner 上追加显示
          var diag = document.getElementById('__diag_ts')
          if (diag) {
            diag.textContent += ' · unregistered ' + regs.length + ' SW'
          }
        })
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k) })
          })
        }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
