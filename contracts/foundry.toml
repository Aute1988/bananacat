# Foundry 配置
# 香蕉猫 Launchpad 智能合约测试套件

[profile.default]
src = "src"
out = "out"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
test = "test"
via_ir = true

# OpenZeppelin / PancakeSwap 从 node_modules 加载
# Foundry remappings: prefix before last path component is replaced by remapping target
# - OZ: import "@openzeppelin/contracts/..." in code, file at ".../contracts/token/..."
#   so remap target = node_modules/@openzeppelin/contracts/contracts
# - PancakeSwap: import "@pancakeswap/v2-core/contracts/...", file at ".../contracts/contracts/..."
#   so remap target = node_modules/@pancakeswap/v2-core
remappings = [
    "@openzeppelin/contracts=node_modules/@openzeppelin/contracts/contracts",
    "@pancakeswap/v2-core=node_modules/@pancakeswap/v2-core",
    "@pancakeswap/v2-periphery=node_modules/@pancakeswap/v2-periphery",
    "forge-std/lib/forge-std/src=lib/forge-std/src",
]

# Forge 标准库(安装: forge install foundry-rs/forge-std)
# git clone https://github.com/foundry-rs/forge-std lib/forge-std --depth 1
# 然后: forge install
# lib 目录: forge-std 在 lib/forge-std
[profile.default.fuzz]
runs = 256
